<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Dashboard | Abdulaziz International School</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
  <div class="brand">Abdulaziz <span>Staff Portal</span></div>
  <nav><span id="who"></span><button class="btn btn-sm" onclick="logout('staff')">Log out</button></nav>
</header>
<main class="container grid">
  <section class="card"><h3>Post Announcement</h3>
    <form id="annForm">
      <label for="annTitle">Title</label><input id="annTitle" required>
      <label for="annBody">Message</label><textarea id="annBody" rows="3" required></textarea>
      <button class="btn btn-green form-submit">Post</button>
    </form>
  </section>
  <section class="card"><h3>Record Student Score</h3>
    <form id="scoreForm">
      <label for="stu">Student</label><select id="stu"></select>
      <label for="subject">Subject</label><input id="subject" required>
      <label for="score">Score (0–100)</label><input id="score" type="number" min="0" max="100" required>
      <button class="btn btn-green form-submit">Save Score</button>
    </form>
  </section>
  <section class="card full"><h3>All Recorded Scores</h3>
    <div class="table-scroll"><table><thead><tr><th>Student</th><th>Subject</th><th>Score</th><th></th></tr></thead><tbody id="scores"></tbody></table></div>
  </section>
  <section class="card full"><h3>Announcements</h3><div id="announcements"></div></section>
</main>
<footer class="site-footer">
  <nav class="footer-nav" aria-label="Footer">
    <a href="terms.html">Terms and Conditions</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <p>&copy; Abdulaziz International School</p>
</footer>
<script src="auth.js"></script>
<script src="staff.js"></script>
</body>
</html>
