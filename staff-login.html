<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login | Abdulaziz International School</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-box staff" id="loginForm">
    <h1>Abdulaziz International School</h1>
    <p class="sub">Staff Portal Login</p>
    <label for="userId">Staff ID</label>
    <input type="text" id="userId" autocomplete="username" required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div class="error" id="error"></div>
    <button class="btn btn-green" type="submit">Log In</button>
    <div class="hint">Demo login — Staff ID: <b>STF001</b> &nbsp; Password: <b>staff123</b></div>
    <a class="back" href="index.html">← Back to home</a>
  </form>
</div>
<footer class="site-footer">
  <nav class="footer-nav" aria-label="Footer">
    <a href="terms.html">Terms and Conditions</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>
  <p>&copy; Abdulaziz International School</p>
</footer>
<script src="auth.js"></script>
<script>setupLogin("staff");</script>
</body>
</html>
